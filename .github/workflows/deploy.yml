name: Scrape & Deploy

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        if: github.event_name != 'push'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        if: github.event_name != 'push'
        run: uv sync --locked

      - name: Run scraper
        if: github.event_name != 'push'
        id: scrape
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python -m scraper.run

      - name: Check scraper output
        if: github.event_name != 'push'
        id: check
        run: |
          if [ "${{ steps.scrape.outcome }}" = "success" ] && [ -f "web/data/cards.json" ] && [ -s "web/data/cards.json" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "Scraper produced fresh data"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Scraper failed or empty, will use committed fallback data"
          fi

      - name: Commit updated data & cache
        if: github.event_name != 'push' && steps.check.outputs.fresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/ translation_cache.json
          git diff --cached --quiet || git commit -m "chore: update scraped data & translation cache [skip ci]"
          git push || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
