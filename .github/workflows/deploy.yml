name: Scrape & Deploy

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow by default; the cold-cache seed step deepens history on
          # demand (only when it must recover translation_cache.json).
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Push builds from committed data; scrape/dispatch runs rebuild from fresh
      # data after scraping (below), so they skip this and verify the rebuild.
      - name: Generate static SEO language pages (committed data)
        if: github.event_name == 'push'
        run: node scripts/build_seo_pages.mjs

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        if: github.event_name != 'push'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        if: github.event_name != 'push'
        run: uv sync --locked

      - name: Restore translation cache
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: translation_cache.json
          key: translation-cache-${{ github.run_id }}
          restore-keys: |
            translation-cache-

      - name: Seed translation cache from git history (cold-cache fallback)
        if: github.event_name != 'push'
        run: |
          if [ ! -f translation_cache.json ]; then
            # Cold cache: deepen the shallow clone so history lookups work.
            git fetch --unshallow --quiet 2>/dev/null || true
            # Most recent commit touching the file is its removal commit, so
            # fall back to that commit's parent where the file still existed.
            last=$(git rev-list -1 HEAD -- translation_cache.json || true)
            if [ -n "$last" ] && git show "$last:translation_cache.json" > translation_cache.json 2>/dev/null; then
              echo "Seeded translation cache from commit $last"
            elif [ -n "$last" ] && git show "$last^:translation_cache.json" > translation_cache.json 2>/dev/null; then
              echo "Seeded translation cache from parent of removal commit $last"
            else
              rm -f translation_cache.json
              echo "No translation cache in history; starting fresh."
            fi
          fi

      - name: Run scraper
        if: github.event_name != 'push'
        id: scrape
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python -m scraper.run

      - name: Save translation cache
        if: always() && github.event_name != 'push'
        uses: actions/cache/save@v4
        with:
          path: translation_cache.json
          key: translation-cache-${{ github.run_id }}

      - name: Check scraper output
        if: github.event_name != 'push'
        id: check
        run: |
          if [ -f "web/data/cards.json" ] && [ -s "web/data/cards.json" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "Scraper produced fresh data"
          else
            echo "::error::Scraper completed without a non-empty web/data/cards.json"
            exit 1
          fi

      - name: Rebuild SEO pages with fresh data
        if: github.event_name != 'push'
        run: node scripts/build_seo_pages.mjs

      # Verify the final built pages (committed-data build on push, fresh-data
      # rebuild on scrape/dispatch).
      - name: Verify multilingual SEO pages
        run: node scripts/check_seo_pages.mjs

      - name: Verify Google site and analytics tags
        run: node scripts/check_google_tags.mjs

      - name: Verify rendered external data is sanitized
        run: node scripts/check_render_sanitization.mjs

      - name: Verify key GA event contract
        run: node scripts/check_key_ga_events.mjs

      - name: Commit updated data
        if: github.event_name != 'push' && steps.check.outputs.fresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/ web/sitemap.xml x_posts.json deck_codes.json hocg_logs_state.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: update scraped data [skip ci]"
          # Tolerate a concurrent push to master (e.g. a frontend commit landing
          # mid-run): re-stage ONLY our regenerated data on top of the latest tip
          # and retry, rather than failing the whole deploy. Using a mixed reset
          # (not --soft) keeps the concurrent commit's files in the index, so they
          # are preserved; we only overlay web/data, web/sitemap.xml, and the
          # scraper state files (x_posts.json, deck_codes.json).
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push attempt $attempt rejected; re-syncing onto latest master."
            git fetch origin master
            git reset --mixed FETCH_HEAD
            git add web/data/ web/sitemap.xml x_posts.json deck_codes.json hocg_logs_state.json
            if git diff --cached --quiet; then
              echo "Remote already has this data; nothing to push."
              exit 0
            fi
            git commit -m "chore: update scraped data [skip ci]"
          done
          echo "::error::Failed to push scraped data after 5 attempts."
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  alert-on-failure:
    needs: build-and-deploy
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update pipeline-failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Scrape & Deploy failed: ${runUrl}`,
              '',
              `- Event: \`${context.eventName}\``,
              `- Commit: \`${context.sha.slice(0, 7)}\``,
              `- Time: ${new Date().toISOString()}`,
            ].join('\n');
            try {
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: 'b60205',
                description: 'Automated scrape/deploy pipeline failure',
              });
            } catch (e) { /* label already exists */ }
            const open = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: label,
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: open.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: 'Scrape & Deploy pipeline failing',
                body,
                labels: [label],
              });
            }

  close-issue-on-success:
    needs: build-and-deploy
    # Only a successful scrape (not a frontend-only push deploy) proves the
    # pipeline recovered, so scope this to non-push events.
    if: ${{ success() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close resolved pipeline-failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `✅ Resolved by a successful Scrape & Deploy run: ${runUrl}`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
