name: Guard Google tags

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  google-tags:
    name: Verify Google tags
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Google site and analytics tags
        run: node scripts/check_google_tags.mjs

      - name: Verify multilingual SEO pages
        run: |
          node scripts/build_seo_pages.mjs
          node scripts/check_seo_pages.mjs
