<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — 找不到頁面 / Page Not Found | HOLOCARD META</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { --bg-0: #0a0e1f; --bg-2: #161d3e; --border: #3a3258; --text-1: #f0e6d2; --text-2: #b5a98b; --accent: #f4c842; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg-0); color: var(--text-1); font-family: 'Noto Sans TC', 'Noto Sans JP', system-ui, sans-serif; line-height: 1.7; padding: 2rem 1.25rem 4rem; display: grid; min-height: 100vh; place-items: center; }
    main { max-width: 560px; text-align: center; }
    .code { font-size: 3.4rem; font-weight: 900; color: var(--accent); letter-spacing: .06em; }
    h1 { font-size: 1.25rem; margin: .4rem 0 .6rem; }
    p { color: var(--text-2); font-size: .92rem; margin-bottom: 1.6rem; }
    .links { display: flex; gap: .7rem; justify-content: center; flex-wrap: wrap; }
    .links a { display: inline-block; border: 1px solid var(--border); background: var(--bg-2); color: var(--text-1); text-decoration: none; padding: .55rem 1.1rem; border-radius: 8px; font-size: .9rem; }
    .links a.primary { background: var(--accent); border-color: var(--accent); color: #1a0e02; font-weight: 700; }
    .links a:hover { border-color: var(--accent); }
    footer { color: var(--text-2); font-size: .78rem; margin-top: 2.4rem; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>找不到這個頁面 / Page not found</h1>
    <p>這個網址可能已搬家或不存在。下面的入口可以帶你回到牌組資料。<br>
       The page you are looking for does not exist or has moved.</p>
    <div class="links">
      <a class="primary" href="/">回首頁 / Home</a>
      <a href="/deck/">牌組一覽 / All decks</a>
      <a href="/#cards">卡片搜尋 / Card search</a>
    </div>
    <footer>Fan-made. Card data © 2016 COVER Corp. / hololive OFFICIAL CARD GAME · <a href="/privacy.html">Privacy</a></footer>
  </main>
</body>
</html>
