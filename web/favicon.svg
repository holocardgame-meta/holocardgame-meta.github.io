<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4c842"/>
      <stop offset="100%" stop-color="#c98e1f"/>
    </linearGradient>
  </defs>
  <!-- Rounded gold backdrop, matches the sidebar .brand-mark -->
  <rect x="0" y="0" width="64" height="64" rx="10" ry="10" fill="url(#bg)"/>
  <rect x="0" y="0" width="64" height="64" rx="10" ry="10" fill="none" stroke="#ffe48a" stroke-width="2"/>
  <!-- Card fan glyph (dark on gold), 24x24 source upscaled ~2.4x and centered -->
  <g transform="translate(4 4) scale(2.33)" fill="#1a0e02">
    <g transform="rotate(-12 12 13)">
      <rect x="5" y="6" width="11" height="14" rx="1.5" opacity=".55"/>
    </g>
    <g transform="rotate(8 12 13)">
      <rect x="8" y="5" width="11" height="14" rx="1.5"/>
      <circle cx="13.5" cy="12" r="2" fill="rgba(0,0,0,.4)"/>
    </g>
  </g>
</svg>
